  - generic [ref=e87]:
    - heading "Agregar himnos" [level=2] [ref=e88]
    - paragraph [ref=e89]: Los himnos del 2 al 652 salen del escaneo de Celebremos su Gloria con sus cuatro voces. El reconocimiento automático deja algunas notas equivocadas; si un himno suena raro, corrígelo en MuseScore y vuelve a cargarlo aquí.
    - paragraph [ref=e90]:
      - text: Puedes cargar archivos MusicXML (
      - code [ref=e91]: .mxl
      - text: ","
      - code [ref=e92]: .musicxml
      - text: o
      - code [ref=e93]: .xml
      - text: ) exportados de MuseScore, uno o varios a la vez. El nombre del archivo debe empezar con el número del himno, por ejemplo
      - code [ref=e94]: 045.mxl
      - text: o
      - code [ref=e95]: 045 Castillo fuerte.mxl
      - text: . Si ya existe un himno con ese número, se reemplaza.
    - generic [ref=e96]: Elegir archivos
    - paragraph [ref=e98]: "Sonidos de instrumentos: soundfont FluidR3 GM de Frank Wen (licencia MIT)."
    - paragraph [ref=e99]: "Teclado de la computadora: números para marcar, Enter para tocar, Espacio para pausar, Esc para detener."